{% extends "base.html" %}
{% block content %}
<div class="container panel-container page-shell">
  <a class="back-link" href="{{ url_for('dataset_blueprint.datasets') }}">
    <i class="fa fa-arrow-left"></i> Back to data sets
  </a>
  <div class="page-header">
    <div>
      <p class="page-eyebrow">Governed resources</p>
      <h2 class="page-title">Set detail</h2>
      <p class="page-subtitle">Chỉnh sửa metadata cấp set mà không thay đổi luồng dataset hiện có.</p>
    </div>
  </div>
  {% if error %}<p class="auth-error">{{ error }}</p>{% endif %}
  <form method="POST" action="{{ url_for('dataset_blueprint.set_detail') }}" class="form-card">
    <input type="hidden" name="SetId" value="{{ SetId }}">
    <div class="input-group">
      <label><i class="fa fa-tag"></i> Set name</label>
      <input type="text" name="SetName" value="{{ set_info.get('SetName','') }}" required>
    </div>
    <div class="input-group">
      <label><i class="fa fa-cogs"></i> Services</label>
      <input type="text" name="Services" value="{{ set_info.get('Services','') }}" required>
    </div>
    <div class="input-group">
      <label><i class="fa fa-key"></i> Set code</label>
      <input type="text" name="SetCode" value="{{ set_info.get('SetCode','') }}" required>
    </div>
    <div class="action-row">
      <button type="submit" class="btn btn-primary"><i class="fa fa-save"></i> Save</button>
      <a class="btn" href="{{ url_for('dataset_blueprint.dataset_detail', SetId=SetId) }}">Datasets</a>
      {% if SetId and SetId != 'New' %}
      <a class="btn btn-danger" href="#" onclick="return deleteSet('{{ SetId }}','{{ set_info.get('SetName','') }}')">Delete</a>
      {% endif %}
    </div>
  </form>
</div>
<script>
  function deleteSet(id, name) {
    if (!id) return false;
    const confirmed = confirm(`Delete set \"${name || id}\"? This will remove its datasets and permissions.`);
    if (!confirmed) return false;
    const url = '{{ url_for("dataset_blueprint.set_deletion") }}' + '?SetId=' + encodeURIComponent(id);
    window.location.href = url;
    return false;
  }
</script>
{% endblock %}
