{% extends "base.html" %}
{% block content %}
  <div class="container panel-container page-shell">
    <a class="back-link" href="{{ url_for('role_blueprint.Role') }}">
      <i class="fa fa-arrow-left"></i> Back to roles
    </a>
    <form method="POST" class="form-card">
        <input type="hidden" name="id" value="{{ role.get('id','New') }}">
        <div class="section-block">
          <div>
            <p class="page-eyebrow">Access bundles</p>
            <h2 class="page-title">Role info</h2>
          </div>
          <div class="input-group">
              <label for="RoleName"><i class="fa fa-tag"></i> Role name</label>
              {% if role.get('RoleName') %}
                <input id="RoleName" type="text" disabled value="{{role.get('RoleName')}}" placeholder="Role Name" name="RoleName"/>
              {% else %}
                <input id="RoleName" type="text" placeholder="Role Name" name="RoleName"/>
              {%endif%}
          </div>

          <div class="input-group">
            <label for="Description"><i class="fa fa-align-center"></i> Description</label>
            <input id="Description" type="text" value="{{role.get('Description','')}}" placeholder="Description" name="Description" />
          </div>

          <div class="form-row">
            <div class="input-group">
              <label for="LastUpdateDateTime"><i class="fa fa-history"></i> Last update</label>
              <input id="LastUpdateDateTime" type="text" disabled value="{{role.get('LastUpdateDateTime','')}}" placeholder="Last Update DateTime" name="LastUpdateDateTime" />
            </div>
            <div class="input-group">
              <label for="LastUpdateUserName"><i class="fa fa-user"></i> Updated by</label>
              <input id="LastUpdateUserName" type="text" disabled value="{{role.get('LastUpdateUserName','')}}" placeholder="Last Update User Name" name="LastUpdateUserName" />
            </div>
          </div>
          <div class="input-group">
            <label for="xpermission"><i class="fa fa-check-circle"></i> Permissions</label>
            <select id="xpermission" name="Permission"></select>
          </div>
        </div>
        <div class="action-row">
          <button type="submit" class="btn btn-primary"><i class="fa fa-save"></i> Save</button>
          <button type="button" onclick="window.location.href='{{ url_for('role_blueprint.role_detail', id = role.get('id')) }}'"><i class="fa fa-undo"></i> Undo</button>
        </div>
    </form>
  </div>
  <script>
    $(document).ready(function(){
      
      const rolepermissions = {{ permissions | safe }};
      var $xpermission = $('#xpermission');
      $xpermission.select2({
        placeholder: '--- SELECT ---',
        allowClear: true,
        tags: true,
        multiple: true,
        closeOnSelect: true,
        // minimumInputLength: 2,
        data: rolepermissions,
        ajax: {          
          url: "{{url_for('permission_blueprint.getRolePermissionList')}}",
          type: "POST",
          contentType: "application/json; charset=utf-8",
          dataType: "json",
          data: function (params) {
            return JSON.stringify({
              Code: params.Code || '',
              page: params.page || 1
            })
          },
          processResults: function (data,params) {
            // var page = params.page;
            var result = $.map(data, function (item){
                return {
                  text: item.text,
                  id: item.id
                };
              });
            return {
              results: result,
              pagination: {
                more:data.length > 0
              }
            };
          }
        }
      })
      const permissionids = [];
      for(const permission of {{ permissions | safe }}){               
        permissionids.push(permission.id)
      };
      $xpermission.val(permissionids).trigger("change");   
    });
   
    
  </script>
  
{% endblock %}
