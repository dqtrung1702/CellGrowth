{% extends "base.html" %}
{% block content %}
  <div class="container panel-container page-shell">
    <a class="back-link" href="{{ url_for('user_blueprint.User') }}">
      <i class="fa fa-arrow-left"></i> Back to users
    </a>
    <form method="POST" class="form-card">
        <div class="section-block">
          <div>
            <p class="page-eyebrow">Identity directory</p>
            <h2 class="page-title">User info</h2>
          </div>
          <div class="input-group">
            <label for="UserName"><i class="fa fa-user"></i> User name</label>
            <input id="UserName" type="text" disabled value="{{user.get('UserName')}}" placeholder="User Name" name="UserName"/>
          </div>
          <div class="input-group">
            {% if user.get('UserLocked')== True %}
              <input id="UserLocked" checked type="checkbox" name="UserLocked" />
            {% else %}
              <input id="UserLocked" type="checkbox" name="UserLocked" />
            {% endif %}
            <label for="UserLocked"><i class="fa fa-lock"></i> User locked</label>
          </div>
          <div class="input-group">
            <input id="PasswordChanging" onclick="chg_pass()" type="checkbox" class=""/>
            <label for="PasswordChanging" class=""><i class="fa fa-key"></i> Need to change password?</label>
            <input style="display: none;" disabled type="password" id="inputPassword" placeholder="New Password" name="Password"/>
          </div>
          <div class="input-group">
            <label for="NameDisplay"><i class="fa fa-tag"></i> Name display</label>
            <input id="NameDisplay" type="text" value="{{user.get('NameDisplay')}}" placeholder="Name Display" name="NameDisplay" />
          </div>
          <div class="input-group">
            <label for="DataPermission"><i class="fa fa-table"></i> Data permission</label>
            <select id="DataPermission" name="DataPermission"></select>
          </div>
          <div class="input-group">
            <label for="LastSignOnDateTime"><i class="fa fa-history"></i> Last sign-on</label>
            <input id="LastSignOnDateTime" type="text" disabled value="{{user.get('LastSignOnDateTime')}}" placeholder="Last SignOn DateTime" name="LastSignOnDateTime" />
          </div>
          <div class="form-row">
            <div class="input-group">
              <label for="LastUpdateDateTime"><i class="fa fa-clock-o"></i> Last update</label>
              <input id="LastUpdateDateTime" type="text" disabled value="{{user.get('LastUpdateDateTime')}}" placeholder="Last Update DateTime" name="LastUpdateDateTime" />
            </div>
            <div class="input-group">
              <label for="LastUpdateUserName"><i class="fa fa-user"></i> Updated by</label>
              <input id="LastUpdateUserName" type="text" disabled value="{{user.get('LastUpdateUserName')}}" placeholder="Last Update User Name" name="LastUpdateUserName" />
            </div>
          </div>
          <div class="input-group">
            <label for="xrole"><i class="fa fa-list"></i> Roles</label>
            <select id="xrole" name="xrole"></select>
          </div>
        </div>
        <div class="action-row">
          <button type="submit" class="btn btn-primary"><i class="fa fa-save"></i> Save</button>
          <button type="button" onclick="window.location.href='{{ url_for('user_blueprint.user_detail', id = user.get('id')) }}'"><i class="fa fa-undo"></i> Undo</button>
        </div>
    </form>
  </div>
  <script>
    $(document).ready(function(){
      // RoleList
      const userroles = {{ roles | safe }};
      var $xrole = $('#xrole');
      $xrole.select2({
        placeholder: '--- SELECT ---',
        allowClear: true,
        tags: true,
        multiple: true,
        closeOnSelect: true,
        // minimumInputLength: 2,
        data: userroles,
        ajax: {          
          url: "{{url_for('role_blueprint.getRoleList')}}",
          type: "POST",
          contentType: "application/json; charset=utf-8",
          dataType: "json",
          data: function (params) {
            return JSON.stringify({
              Code: params.Code || '',
              page: params.page || 1
            })
          },
          processResults: function (data,params) {
            // var page = params.page;
            var result = $.map(data, function (item){
                return {
                  text: item.text,
                  id: item.id
                };
              });
            return {
              results: result,
              pagination: {
                more:data.length > 0
              }
            };
          }
        }
      })
      const roleids = [];
      for(const role of {{ roles | safe }}){               
        roleids.push(role.id)
      };
      $xrole.val(roleids).trigger("change");      
      // DataPermissionList
      const datapermission = {{ datapermission | tojson }};
      var datapermissionlist = datapermission.id ? [datapermission] : [];
      var $DataPermission = $('#DataPermission');
      $DataPermission.select2({
        placeholder: '--- SELECT ---',
        allowClear: true,
        tags: true,
        multiple: true,
        closeOnSelect: true,
        // minimumInputLength: 2,
        data: datapermissionlist,
        ajax: {          
          url: "{{url_for('permission_blueprint.getDataPermissionList')}}",
          type: "POST",
          contentType: "application/json; charset=utf-8",
          dataType: "json",
          data: function (params) {
            return JSON.stringify({
              Code: params.Code,
              page: params.page || 1
            })
          },
          processResults: function (data,params) {
            // var page = params.page;
            var result = $.map(data, function (item){
                return {
                  text: item.text,
                  id: item.id
                };
              });
            return {
              results: result,
              pagination: {
                more:data.length > 0
              }
            };
          }
        }
      });
      if(datapermission.id){
        $DataPermission.val(datapermission.id).trigger("change");
      } else {
        $DataPermission.val(null).trigger("change");
      }
    });
    
    function chg_pass() 
    {
      // Get the checkbox
      var checkBox = document.getElementById("PasswordChanging");
      // Get the output text
      var inputPassword = document.getElementById("inputPassword");

      // If the checkbox is checked, display the output text
      if (checkBox.checked == true){
        inputPassword.style.display = "block";
        inputPassword.disabled  = false
      } else {
        inputPassword.style.display = "none";
        inputPassword.disabled  = true
      }
    }
    
  </script>
  
{% endblock %}
